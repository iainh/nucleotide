# Nucleotide configuration
# Place this file as nucleotide.toml in your Helix config directory.
# The usual path is ~/.config/helix/nucleotide.toml.
# On Windows, use %APPDATA%\helix\nucleotide.toml.
#
# This file controls Nucleotide GUI settings. Standard Helix editor settings
# and keybindings belong in config.toml in the same directory, and language
# server definitions belong in languages.toml. They are loaded separately;
# this file is not a replacement for either Helix configuration file.
#
# Every supported nucleotide.toml parameter is shown below. Active assignments
# use the defaults. Optional overrides and custom marker entries are commented
# out so copying this file preserves platform defaults and an empty marker map.
# TOML has no null value: leave an optional setting commented out to keep it unset.
# Uncomment a table header along with its settings to enable an optional table.
# Missing fields use defaults; unknown keys are currently ignored.
# Invalid TOML or field types cause all GUI settings to fall back to defaults.
# Save this file, then choose Settings > Reload Configuration (under Nucleotide
# on macOS/Linux or File on Windows), or restart Nucleotide.

# Limit how many editor tabs Nucleotide keeps open.
# Default: unset, which keeps tabs open until you close them.
# Set this to a positive integer (0 is invalid) to close the least-recently-focused
# clean, unpinned tabs over the limit. Preview tabs do not count toward the cap.
# Protected, pinned or modified tabs can leave the count above this soft limit.
# Keep this top-level key before any table headers.
# max_tabs = 10

[updates]
# Check for stable updates in Velopack-installed builds. Default: true.
enabled = true

# Check shortly after the first application window opens. Default: true.
check_on_startup = true

# Download discovered updates automatically. Restart remains user-controlled.
# Default: false.
auto_download = false

[theme]
# Select how the GUI chooses between light and dark themes.
# Options: "system", "light", "dark"; "auto" aliases "system". Default: "system".
mode = "system"

# Theme used when light appearance is active. Default: "nucleotide-sandcastle".
# Try "nucleotide-paper" for Warm Paper's quieter ivory palette.
light_theme = "nucleotide-sandcastle"

# Theme used when dark appearance is active. Default: "nucleotide-teal".
# "nucleotide-teal" is Refined Teal; "nucleotide-graphite" is Graphite Studio.
# Switch immediately with :theme <name> in the editor command prompt.
dark_theme = "nucleotide-teal"

[window]
# Enable blur/vibrancy for dark themes where the platform supports it.
# Default: false.
blur_dark_themes = false

# Chrome background opacity, from 0.0 to 1.0. Default: 1.0 (opaque).
# Try 0.92 for subtle translucency in titlebar, file tree, tabs and status bar.
# Text, code, terminal content and floating pickers/completion stay opaque.
# Desktop transparency needs compositor support; blur is platform-dependent.
chrome_opacity = 1.0

# Update the native window appearance when the theme changes. Default: true.
appearance_follows_theme = true

# Optional Windows DirectWrite text rendering overrides. By default, Nucleotide
# follows the active monitor's Windows/DirectWrite font rendering settings.
# The table and every field default to unset; numbers below are examples, not
# fixed defaults. These settings have no effect on other platforms.
# Reload configuration or restart after changing these values.
# [window.directwrite]
# Gamma correction. Default: unset (monitor setting). Finite range: 1.0 to 2.2.
# DirectWrite accepts a wider range, but GPUI's gamma table uses this range.
# gamma = 1.8
#
# Enhanced text contrast. Default: unset (monitor setting).
# Range: finite, 0.0 or greater.
# enhanced_contrast = 0.75
#
# Subpixel rendering strength. Default: unset (monitor setting).
# Finite range: 0.0 to 1.0. A value of 0.0 disables ClearType for grayscale text.
# clear_type_level = 1.0
#
# Subpixel order. Default: unset (monitor setting).
# Options: "flat", "rgb", "bgr". "flat" uses grayscale text.
# pixel_geometry = "rgb"
#
# Glyph rasterization mode. Default: unset (monitor setting).
# Options: "default", "aliased", "gdi_classic", "gdi_natural", "natural",
# "natural_symmetric". "aliased" uses grayscale text.
# rendering_mode = "natural_symmetric"
# Invalid numeric overrides are individually discarded, retaining monitor defaults.

[ui]
# Select how Nucleotide styles non-editor UI chrome.
# Options: "theme", "system". Default: "theme".
# On Windows, "system" uses a Fluent palette and the Mica window backdrop.
# On macOS, "system" uses native vibrancy for chrome and the project sidebar.
look = "theme"

# Font used for menus, prompts, pickers and other UI chrome.
# Table default: unset. Missing fields in an enabled table use the defaults below.
# [ui.font]
# Font family. Default: ".SystemUIFont" (GPUI's platform system font).
# "SF Pro Display", "SF Pro" and "system-ui" also resolve to ".SystemUIFont".
# family = ".SystemUIFont"

# Font weight.
# Options: "thin", "extralight", "light", "normal", "medium", "semibold",
# "bold", "extrabold", "black". Default: "normal".
# weight = "normal"

# Font size in pixels. Default: platform UI font size on macOS and Windows,
# with a 13.0 fallback; Windows enforces a 14.0 minimum on this default only.
# Default on Linux and other platforms: 13.0. The number below is an override
# example, not a portable default.
# size = 13.0

# Line-height multiplier. Default: 1.5.
# line_height = 1.5

# Font used in the editor view.
# Table default: unset. If [ui.font] is configured but [editor.font] is not,
# the editor inherits that UI font configuration. If neither is configured,
# it uses the platform monospace family, "normal", 14.0 and 1.5.
# An enabled [editor.font] table uses the defaults below for missing fields,
# rather than inheriting individual fields from [ui.font].
# [editor.font]
# Font family. Default: "SF Mono" on macOS, "Cascadia Mono" on Windows,
# "monospace" on other platforms. The value below is the macOS example.
# family = "SF Mono"

# Font weight.
# Options: "thin", "extralight", "light", "normal", "medium", "semibold",
# "bold", "extrabold", "black". Default: "normal".
# weight = "normal"

# Font size in pixels. Default: 14.0.
# size = 14.0

# Line-height multiplier. Default: 1.5.
# line_height = 1.5

# Optional editor ligatures. Unset preserves font/platform defaults.
# Set true to enable or false to disable liga, clig and calt substitutions.
# Requires a font with ligatures, such as Fira Code or JetBrains Mono.
# Ligatures break around the focused block cursor so its character stays clear.
# Reload Configuration applies changes without restarting. UI/terminal text is unchanged.
# ligatures = true

[tab_bar]
# Show the tab bar. Default: true.
show = true

# Show back/forward navigation buttons in the tab bar. Default: true.
show_nav_history_buttons = true

# Show tab-bar action buttons such as new file and split controls.
# Default: true.
show_tab_bar_buttons = true

# Render pinned tabs in a separate row when both pinned and unpinned tabs are
# open. Default: false.
show_pinned_tabs_in_separate_row = false

[tabs]
# Tabs use flat, contiguous surfaces with subtle separators and a bottom accent
# on the active tab. Unsaved dots and diagnostic markers sit after the label;
# the configured close or pin control remains separate from these indicators.

# Show git status decorations on tabs. Default: false.
git_status = false

# Show file icons on tabs. Default: true.
file_icons = true

# Show diagnostic decorations on tabs.
# Options: "off", "errors", "all" (errors and warnings). Default: "off".
show_diagnostics = "off"

# Show close buttons on unpinned tabs.
# Options: "always", "hover", "hidden". Default: "always".
show_close_button = "always"

# Position the close or pin button on each tab.
# Options: "left", "right". Default: "right".
close_position = "right"

# Choose which tab becomes active after closing the active tab.
# Options: "history", "neighbour", "left_neighbour". Default: "history".
# "history" returns to the previously active tab. "neighbour" prefers the right
# neighbour, then the left; "left_neighbour" reverses that preference.
activate_on_close = "history"

[preview_tabs]
# Enable preview tabs. Default: true.
enabled = true

# Open project-panel single-clicked files as preview tabs. Default: true.
enable_preview_from_project_panel = true

# Open file-finder selections as preview tabs. Default: false.
enable_preview_from_file_finder = false

# Intended to open multibuffer files as preview tabs. Default: true.
# Currently parsed but not wired to runtime behaviour.
enable_preview_from_multibuffer = true

# Intended to open code-navigation multibuffers as preview tabs. Default: false.
# Currently parsed but not wired to runtime behaviour.
enable_preview_multibuffer_from_code_navigation = false

# Intended to open code-navigation files as preview tabs. Default: true.
# Currently parsed but not wired to runtime behaviour.
enable_preview_file_from_code_navigation = true

# Intended to keep preview mode after code navigation moves away from a tab.
# Default: false. Currently parsed but not wired to runtime behaviour.
enable_keep_preview_on_code_navigation = false

[file_tree]
# Project tree row density.
# Options: "compact", "default", "relaxed". Default: "default".
density = "default"

# Collapse single-child directory chains into one row. Default: true.
flatten_empty_directories = true

[file_ops]
# Delete behaviour for file-tree delete actions.
# Options: "trash", "permanent". Default: "trash".
delete_behavior = "trash"

[remote.ssh]
# Remote backend environment overrides take precedence over these settings:
# NUCLEOTIDE_REMOTE_HELPER_INSTALL (SSH and WSL install policy),
# NUCLEOTIDE_REMOTE_HELPER (SSH and WSL helper path),
# NUCLEOTIDE_SSH_CONNECT_TIMEOUT_SECS, NUCLEOTIDE_SSH_EXTRA_ARGS,
# NUCLEOTIDE_SSH_CONTROL_MASTER and NUCLEOTIDE_SSH_CONTROL_PATH.
# How Nucleotide installs nucleotide-remote on SSH hosts.
# Options: "auto", "never", "upload", "remote_download". Default: "auto".
# "auto" reuses a matching helper, otherwise uploads; if the local artifact is
# unavailable, it tries remote download. With an explicit helper_path, "auto"
# uses that path without installing a helper.
# "never" requires an existing helper; "upload" requires a local helper artifact.
# "remote_download" requires curl or wget plus sha256sum or shasum on the SSH
# host. Set NUCLEOTIDE_REMOTE_HELPER_DOWNLOAD_BASE_URL to use a release mirror.
helper_install = "auto"

# Remote helper path override. Default: unset, which uses a versioned cache
# under ${XDG_CACHE_HOME:-$HOME/.cache}/nucleotide/remote after auto-install.
# helper_path = "/home/me/.local/bin/nucleotide-remote"

# SSH connection timeout in seconds. Default: 30.
# Set to 0 to disable Nucleotide's timeout.
connect_timeout_secs = 30

# Extra arguments passed to ssh before the target. Prefer ~/.ssh/config for
# long-lived host settings. Default: []. Example: ["-J", "bastion"].
extra_args = []

# Reuse SSH connections with OpenSSH ControlMaster on Unix. Default: unset,
# which enables reuse on Unix and disables it elsewhere. A true override does
# not enable ControlMaster on non-Unix platforms.
# use_control_master = true

[remote.wsl]
# WSL uses the same bundled Linux helpers, version checks, and install modes as
# SSH. "remote_download" requires the same download and checksum tools inside
# the distro. Default: "auto".
# Options: "auto", "never", "upload", "remote_download" (as described above).
helper_install = "auto"

# Helper path override inside the distro. Default: unset, which uses the same
# versioned XDG cache layout as SSH.
# helper_path = "/home/me/.local/bin/nucleotide-remote"

[lsp]
# Proactively start language servers for detected projects. Default: true.
# Setting false disables proactive startup, not Helix's file-based LSP startup.
project_lsp_startup = true

# Timeout for project LSP preparation/startup, in milliseconds. Default: 5000.
# Valid range: 1 to 60000; server initialization waits use at least 1000 ms.
# A value of 0 resets to 5000; values above 60000 are capped at 60000.
startup_timeout_ms = 5000

[project_markers]
# This section is parsed and validated but currently has no runtime consumer.
# Its intended behaviour is described below; it does not change detection yet.

# Enable custom project markers for project detection. Default: false.
enable_project_markers = false

# Maximum time to spend detecting a project, in milliseconds. Default: 1000.
# Valid range: 1 to 30000. A value of 0 resets to 1000; values above 30000
# are capped at 30000.
detection_timeout_ms = 1000

# Fall back to built-in project detection when no custom marker matches.
# Default: true.
enable_builtin_fallback = true

# Default: no custom marker entries.
# Add marker entries under [project_markers.markers.<name>] in this file.
# If project_markers.toml exists in the Helix config directory, it overrides
# this entire section, not just matching fields. In that separate file, omit the
# project_markers prefix: use top-level settings and [markers.<name>] tables.
# If that file cannot be read or parsed, marker settings fall back to defaults.
#
# [project_markers.markers.rust]
# File-name patterns identifying a project. Required for each marker entry;
# no default. Use at least one non-blank pattern without / or \ separators.
# markers = ["Cargo.toml"]
# Language server name. Required for each marker entry; no default.
# Must not be blank; use a server name defined in Helix's language configuration.
# language_server = "rust-analyzer"
# How to choose a matching ancestor directory. Options: "first" (stop at the
# first match), "closest" (nearest to the file), "furthest" (outermost match).
# Default: "closest".
# root_strategy = "closest"
# Higher numbers win when multiple markers match. Default: 50.
# Accepts unsigned 32-bit integers; sanitization caps priorities at 1000 when
# marker configuration validation fails.
# priority = 50
