[package]
name = "nucleotide-appearance"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
description = "Platform appearance and native chrome resolution for Nucleotide"
rust-version.workspace = true

[dependencies]
gpui.workspace = true

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.61", features = ["UI_ViewManagement"] }
