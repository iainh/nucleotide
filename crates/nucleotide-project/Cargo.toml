[package]
name = "nucleotide-project"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Project detection and manifest provider system for Nucleotide"

[features]
default = []
# The app classifies marker names through its workspace backend. Keep the
# standalone, local-filesystem manifest providers available only on request.
manifest-providers = [
    "dep:nucleotide-logging",
    "dep:serde",
    "dep:serde_json",
    "dep:toml",
    "dep:thiserror",
    "dep:async-trait",
    "dep:regex",
    "dep:tokio",
]

[dependencies]
nucleotide-events.workspace = true
nucleotide-logging = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["fs", "rt", "macros"] }

[dev-dependencies]
tempfile = "3.0"
