[package]
name = "nucleotide-terminal"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
description = "Terminal session and PTY management for Nucleotide (Layer 3)"
categories = ["text-editors", "gui"]
rust-version.workspace = true
build = "build.rs"

[dependencies]
tokio.workspace = true
anyhow.workspace = true
portable-pty = "0.9"
# Keep both bindings on the same revision; this pins Ghostty with Zig 0.16 support.
libghostty-vt = { git = "https://github.com/uzaaft/libghostty-rs", rev = "d2036baeb605d31d09a9e2ba6d0c923e04c34d54", default-features = false, optional = true }
libghostty-vt-sys = { git = "https://github.com/uzaaft/libghostty-rs", rev = "d2036baeb605d31d09a9e2ba6d0c923e04c34d54", optional = true }

[features]
default = []
emulator = ["dep:libghostty-vt", "dep:libghostty-vt-sys"]
