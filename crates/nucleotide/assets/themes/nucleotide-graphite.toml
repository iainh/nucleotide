# Graphite Studio: neutral slate surfaces with cool blue and violet syntax.
# Shares Teal's semantic roles so all editor and GUI states stay consistent.
inherits = "nucleotide-teal"

keyword = "lavender"
tag = "lavender"
function = "link"
"function.builtin" = "link"
constant = "amber"
"constant.builtin" = "amber"
"constant.numeric" = "amber"

[palette]
base = "#171a1f"
chrome = "#20242b"
panel = "#252a32"
gutter_bg = "#171a1f"
caret_row = "#20252d"
separator = "#343b45"
separator_selected = "#4b5868"
indent = "#2a3039"
indent_selected = "#3d4754"
folded_bg = "#263744"
selection = "#29414f"
matched = "#446579"
white = "#f2f5f8"
ink = "#ced5de"
comment = "#a0adbd"
muted_mid = "#a2adbc"
gutter_fg = "#788391"
aqua = "#89dce8"
link = "#8fbcf4"
lavender = "#c3aff5"
sage = "#a5d5a5"
amber = "#e2bb7d"
gold = "#d3ba82"
coral = "#ee948c"
error = "#f39595"
warn = "#dbb36b"
